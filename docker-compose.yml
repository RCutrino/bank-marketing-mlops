services:

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_SCENARIO=without_duration
      - MODELS_DIR=models
    volumes:
      - ./models:/app/models
    depends_on:
      - mlflow
    restart: unless-stopped

  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow -q &&
               mlflow server
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root ./mlruns
               --host 0.0.0.0
               --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    restart: unless-stopped
